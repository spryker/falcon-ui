@if (type === 'password') {
    <spy-input-password
        [value]="value"
        (valueChange)="valueChange($event)"
        [name]="name"
        [spyId]="id"
        [placeholder]="placeholder"
    ></spy-input-password>
} @else {
    <spy-input
        [value]="value"
        (valueChange)="valueChange($event)"
        [name]="name"
        [spyId]="id"
        [type]="type"
        [placeholder]="placeholder"
    ></spy-input>
}
